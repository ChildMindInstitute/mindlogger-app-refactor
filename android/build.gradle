buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 25
        compileSdkVersion = 36
        // Play Store requires app updates to target API 36 from Aug 31, 2026.
        // Targeting 36 opts into Android 16 behavior: edge-to-edge opt-outs are
        // ignored and predictive back is on by default — re-verify inset and
        // Unity fullscreen paths when touching this.
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        // Match the AGP version required by RN 0.81 (also needed for compileSdk 36 and 16KB page size support)
        AGP_VERSION = "8.12.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:$AGP_VERSION")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath 'com.google.gms:google-services:4.4.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
    }
}

allprojects {
    repositories {
        maven {
           // react-native-background-fetch
           url("${project(':react-native-background-fetch').projectDir}/libs")
       }
       flatDir {
         dirs "${project(':unityLibrary').projectDir}/libs"
       }
    }
}

apply plugin: "com.facebook.react.rootproject"
